
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Calculator</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      .calculator {
        width: 380px;
        padding: 30px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
      }

      .subtitle {
        color: #777;
        font-size: 14px;
        margin-bottom: 25px;
      }

      input {
        width: 100%;
        padding: 14px;
        margin-bottom: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        transition: 0.3s;
      }

      input:focus {
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
      }

      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 10px;
      }

      button {
        padding: 13px;
        border: none;
        border-radius: 10px;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
      }

      .add {
        background: #28a745;
      }

      .subtract {
        background: #ff9800;
      }

      .multiply {
        background: #2196f3;
      }

      .divide {
        background: #e91e63;
      }

      .result-box {
        margin-top: 25px;
        padding: 18px;
        background: #f4f5ff;
        border-radius: 12px;
        color: #333;
        font-size: 20px;
        font-weight: bold;
      }

      .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #999;
      }
    </style>
  </head>

  <body>
    <div class="calculator">
      <h1>JavaScript Calculator</h1>
      <p class="subtitle">Perform basic arithmetic operations</p>

      <input type="number" id="num1" placeholder="Enter first number" />

      <input type="number" id="num2" placeholder="Enter second number" />

      <div class="buttons">
        <button class="add" onclick="calculate('+')">+ Addition</button>

        <button class="subtract" onclick="calculate('-')">− Subtraction</button>

        <button class="multiply" onclick="calculate('*')">
          × Multiplication
        </button>

        <button class="divide" onclick="calculate('/')">÷ Division</button>
      </div>

      <div class="result-box" id="result">Result: —</div>

    </div>

    <script>
      function calculate(operator) {
        let num1 = parseFloat(document.getElementById("num1").value);
        let num2 = parseFloat(document.getElementById("num2").value);

        let result;

        // Check whether both numbers are entered
        if (isNaN(num1) || isNaN(num2)) {
          document.getElementById("result").innerHTML =
            "Please enter both numbers";
          return;
        }

        // Perform operation using switch
        switch (operator) {
          case "+":
            result = num1 + num2;
            break;

          case "-":
            result = num1 - num2;
            break;

          case "*":
            result = num1 * num2;
            break;

          case "/":
            if (num2 === 0) {
              result = "Cannot divide by zero";
            } else {
              result = num1 / num2;
            }
            break;

          default:
            result = "Invalid operator";
        }

        document.getElementById("result").innerHTML = "Result: " + result;
      }
    </script>
  </body>
</html>
